name: CI - Cero Deuda Tecnica

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veccit_pos
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veccit_pos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5433
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: veccit_pos_test
      JWT_SECRET: e2e-test-secret
      SUPER_ADMIN_EMAIL: super@test.com
      SUPER_ADMIN_PASSWORD: superadmin123
      UPLOADS_DIR: .e2e-uploads
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Los service containers se inician antes del checkout, por lo que no es
      # posible montar init.sql del repo. Se crea la base e2e manualmente.
      - name: Create e2e test database
        run: docker exec "${{ job.services.postgres.id }}" createdb -U postgres veccit_pos_test

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (sin --fix)
        run: npx eslint "src/**/*.ts" "test/**/*.ts"

      - name: Typecheck
        run: npx tsc --noEmit

      # Skill pos-testing-automation: politica pre-push (cero deuda tecnica)
      - name: Unit tests
        run: npm test

      - name: Integration tests (e2e + PostgreSQL)
        run: npm run test:e2e

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Skill pos-testing-automation: el build incluye typecheck de Next.js
      - name: Build (typecheck + compilacion)
        run: npm run build
