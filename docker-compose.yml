services:
  db:
    image: postgres:16-alpine
    container_name: veccit_pos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: veccit_pos
    ports:
      - "5433:5432"
    volumes:
      - veccit_pos_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d veccit_pos" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  veccit_pos_data:
